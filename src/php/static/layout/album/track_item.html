<li class="track-list-item">
    <dl class="track-item">
    <dt class="sr-only">Numero traccia:</dt>
    <dd class="track-number">[track_number]</dd>
    <dt class="sr-only">Titolo traccia:</dt>
    <dd class="track-title" lang="[lang]">[track_title]</dd>
    <dt class="sr-only">Durata traccia:</dt>
    <dd class="track-duration"><time datetime="[track_duration_datetime]">[track_duration]</time></dd>
    </dl>
</li>
