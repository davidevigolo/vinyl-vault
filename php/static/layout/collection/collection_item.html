<article class="collection-item">
    <img src="[image_url]" alt="">
    <div class="collection-item-details">
        <p class="collection-item-author"><a href="author.php?id=[author_id]">[author]</a></p>
        <h2 class="collection-item-name"><a href="album.php?id=[disk_id]">[title]</a></h2>
