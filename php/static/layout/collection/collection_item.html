<article class="collection-item">
    <a href="album.php?id=[disk_id]" class="card-link-wrapper disk-info" aria-label="Vai alla pagina di [title] di [artist]">
        <img src="[image_url]" alt="Copertina dell'album [title] di [artist]">
        <div class="collection-item-details">
            <p class="artist-name">[author]</p>
            <h2 class="album-title">[title]</h2> <p class="edition-info">[edition_name]</p>
            <p class="release-info">[country] - <time datetime="[year_datetime]">[year]</time></p>

            <div class="collection-rating-section" role="img" 
                 aria-label="Valutazione: [rating_value] su 5 stelle">
                <div class="stars-container readonly" aria-hidden="true">
                    <span class="star" data-value="1">★</span>
                    <span class="star" data-value="2">★</span>
                    <span class="star" data-value="3">★</span>
                    <span class="star" data-value="4">★</span>
                    <span class="star" data-value="5">★</span>
                </div>
                <p class="evaluation-label">Valutazione personale</p>
                <input type="hidden" name="rating" class="rating-input" value="[rating_value]">
            </div>
            
        </div>
    </a>
</article>
