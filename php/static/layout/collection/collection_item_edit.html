<article class="collection-item" role="listitem">
    <div class="disk-info">
        <img src="[image_url]" alt="Copertina dell'album [title] di [author]">
        <div class="collection-item-details">
            <p class="artist-name">[author]</p>
            <h2 class="album-title">[title]</h2>
            <p class="edition-info">[edition_name]</p>
            <p class="release-info">[country] - <time datetime="[year_datetime]">[year]</time></p>
            <fieldset class="collection-rating-section">
                <legend class="evaluation-label">Valutazione personale</legend>
                <div class="stars-container" role="group" aria-label="Seleziona valutazione da 1 a 5 stelle">
                    <button type="button" class="star" data-value="1" aria-label="1 stella">★</button>
                    <button type="button" class="star" data-value="2" aria-label="2 stelle">★</button>
                    <button type="button" class="star" data-value="3" aria-label="3 stelle">★</button>
                    <button type="button" class="star" data-value="4" aria-label="4 stelle">★</button>
                    <button type="button" class="star" data-value="5" aria-label="5 stelle">★</button>

                    <button type="button" class="btn-reset-stars" aria-label="Rimuovi valutazione">×</button>
                </div>

                <input type="hidden" name="rating[]" form="collection-form" class="rating-input" value="[rating_value]">
            </fieldset>
            <input type="hidden" form="collection-form" name="disk_id[]" value="[disk_id]"/>
            <input type="hidden" form="collection-form" name="edition_name[]" value="[edition_name]"/>
        </div>
    </div>
    <div class="delete-selection">
        <label class="checkbox-container">
            <label class="label-text" for="delete-[disk_id]-[edition_name]">Seleziona per eliminare</label>
            <input type="checkbox" form="collection-form" id="delete-[disk_id]-[edition_name]" name="items_to_delete[]" value="[disk_id]_[edition_name]" aria-label="Seleziona [title] per l'eliminazione" [checked]/>
        </label>
    </div>
</article>
