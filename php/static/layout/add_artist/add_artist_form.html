<h2 class="add-pages-title">Aggiungi Artista</h2>
<div id="add-pages">

    [errors]

    <form id="add-pages-form" action="php/controllers/add_artist_controller.php" method="POST"
        enctype="multipart/form-data">
        <fieldset>
            <legend>Informazioni artista</legend>

            <div class="input-wrapper">
                <div class="label-container">
                    <label for="name">Nome dell'artista</label>
                    <span class="required-field">Obbligatorio</span>
                </div>
                <p class="input-example"><abbr title="ad esempio">es.</abbr> Mario Rossi</p>

                <input type="text" id="name" name="name" required maxlength="100" pattern="[a-zA-Z0-9àèéìòùÀÈÉÌÒÙ\s]+"
                    value="[name]" required>
                <ul class="input-examples">
                    <li>Massimo 100 caratteri</li>
                    <li>Caratteri consentiti: lettere, numeri e spazi</li>
                </ul>

            </div>

            <div class="input-wrapper">
                <div class="label-container">
                    <label for="nationality">Nazionalità</label>
                    <span class="required-field">Obbligatorio</span>
                </div>

                <select id="nationality" name="nationality" required>
                    <option value="" disabled selected>Seleziona la nazionalità</option>
                    [nationality_options]
                </select>
            </div>

            <div class="input-wrapper">
                <div class="label-container">
                    <label for="photo">Foto dell'artista</label>
                    <span class="required-field">Obbligatorio</span>
                </div>
                <input type="file" id="photo" name="photo" accept=".jpg,.jpeg,.webp" required>
            </div>

        </fieldset>

        <button type="submit" class="btn-primary add-pages-btn">Aggiungi Artista</button>
    </form>

</div>
