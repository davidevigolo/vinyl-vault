<header>
    <div class="center-container header-container">
        <div class="logo">
            <!-- Mettiamo il link alla home nel logo?-->
            <h1 class="hide" lang="en">VinylVault</h1> <!-- Sostituito con logo tramite image replacement -->
        </div>
        <div class="header-right is-open">
            
            <nav id="menu" aria-label="Menù di navigazione principale">
                <ul class="nav-links">
                    <li>[home]</li>
                    <li>[explore]</li>
                    <li>[catalogue]</li>
                </ul>
            </nav>

            <div class="actions-group"> 
                <button class="search-toggle" aria-labelledby="search-btn-desc">
                    <img class="search-icon" src="assets/images/search.webp" alt="" /><span class="sr-only" id="search-btn-desc">Cerca nel catalogo</span>
                </button>
                <button class="theme-toggle" aria-labelledby="theme-btn-desc">
                    <img class="theme-icon" src="assets/images/moon.webp" alt="" aria-hidden="true" /><span class="sr-only" id="theme-btn-desc">Cambia tema visivo</span>
                </button>
            </div>
            
            <nav class="profile-nav" aria-label='Menù di navigazione del profilo utente'>[profile_nav_menu]</nav>

            <button class="menu-toggle" 
                    aria-expanded="true" 
                    aria-controls="menu" 
                    aria-label="Apri menù di navigazione">
                <span aria-hidden="true">☰</span>
            </button>
        </div>
    </div>
</header>
