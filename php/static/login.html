    <script src="scripts/login_validation.js" defer></script>
</head>

<body>
    <nav aria-label="Aiuti alla navigazione" class="list-help">
        <ul>
            <li>
                <a class="navigation-help" href="#content">Vai al <span lang="en">form</span> di accesso</a>
            </li>
        </ul>
    </nav>

    [header]

    <nav id="breadcrumb" aria-label="Breadcrumb">
        <div class="center-container">
            <ol>
                <li><a href="index.php">Home</a></li>
                <li>Accedi</li>
            </ol>
        </div>
    </nav>
    
    <main id="content">
        <div class="center-container">
            <div class="login">
                <h2>Accedi</h2>
                <p>Torna alla tua collezione personale e alla lista dei desideri.</p>

                <form action="" method="POST" id="login-form">
                    <fieldset>
                        <legend>Credenziali utente</legend>

                        <div class="input-wrapper">
                            <label for="email" lang="en">Email</label>
                            <input type="email" name="email" id="email-input" placeholder="maria.rossi@gmail.com"
                                autocomplete="email" required="required" />
                            [email-error]
                        </div>

                        <div class="input-wrapper">
                            <label for="password" lang="en">Password</label>
                            <input type="password" name="password" id="password-input" autocomplete="current-password"
                                required="required" />
                            [password-error]
                        </div>

                        [auth-error]

                        <button type="submit" id="login-btn" class="btn-primary">Accedi</button>
                    </fieldset>
                </form>

                <p>Nuovo su <span lang="en">VinylVault</span>? <a href="register.php">Registrati</a></p>
            </div>   
        </div>
    </main>

    [footer]

</body>

</html>
